<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; font-src 'self'; img-src 'self' data:; connect-src ipc: http://ipc.localhost"
    />
    <title>FiveProtect</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      The companion window. Four states, one at a time (design document 12.1).

      Nothing here decides anything. The shell hands this page a state and it renders it;
      there is no path from a click to a verdict (ADR 0004).
    -->
    <main class="window" data-state="idle" id="window">
      <!--
        The window has no system frame. Windows draws its title bar in the user's accent
        colour, which sits badly next to a dark utility window and cannot be styled — so the
        shell turns decorations off and this strip takes over dragging and the two controls
        that are actually needed.
      -->
      <header class="titlebar" id="titlebar">
        <svg class="mark" viewBox="0 0 20 20" aria-hidden="true">
          <path
            d="M10 1.6 3 4.8v5.1c0 3.9 2.8 7.2 7 8.5 4.2-1.3 7-4.6 7-8.5V4.8L10 1.6Z"
            fill="none"
            stroke="#4ade9f"
            stroke-width="1.5"
            stroke-linejoin="round"
          />
          <path
            d="m6.9 10.1 2.2 2.2 4.2-4.4"
            fill="none"
            stroke="#4ade9f"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="wordmark">FiveProtect</span>

        <div class="window-controls">
          <button type="button" class="chrome" id="window-minimize" title="Minimieren">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path d="M2.5 6h7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
            </svg>
          </button>
          <button type="button" class="chrome is-close" id="window-close" title="Schließen">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path
                d="m3 3 6 6M9 3l-6 6"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </header>

      <div class="content">
        <div class="state">
          <span class="dot"></span>
          <h1 class="state-name" id="state-name">Nicht verbunden</h1>
        </div>
        <p class="state-note" id="state-note">Warte auf einen Server.</p>

        <div class="progress" id="progress" hidden><span></span></div>

        <!--
          The idle screen. Without it the window is a heading and a lot of nothing, and a
          player cannot tell a companion that is working from one that has hung. The three
          bars are the machine being watched, not a progress bar — there is nothing to be a
          percentage of.
        -->
        <section class="waiting" id="waiting" hidden>
          <div class="pulse" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <p class="waiting-text" id="waiting-text"></p>
        </section>

        <ul class="checks" id="checks"></ul>

        <section class="callout" id="callout" hidden>
          <h2 id="callout-title"></h2>
          <p id="callout-body"></p>
        </section>

        <div class="actions" id="actions" hidden>
          <button type="button" class="primary" id="action-primary"></button>
          <button type="button" class="ghost" id="action-secondary">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M8 2.5v7m0 0L5.2 6.9M8 9.5l2.8-2.6M3 11.5v1a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>Diagnose speichern</span>
          </button>
        </div>
      </div>

      <footer class="footer">
        <span id="version">Version 0.1.0 · Protokoll 1</span>
        <span class="server" id="server"></span>
      </footer>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
