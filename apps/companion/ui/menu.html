<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; font-src 'self'"
    />
    <title>FiveProtect</title>
    <link rel="stylesheet" href="menu.css" />
  </head>
  <body>
    <!--
      The tray menu.

      A window rather than a system menu, because a system menu on Windows cannot be styled
      and a grey Win32 popup hanging off a dark utility window looks like two programs. It
      closes on any choice and whenever it loses focus, which is what a menu is expected to do.
    -->
    <nav class="menu" id="menu">
      <button type="button" data-command="show">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <rect
            x="2.5"
            y="3.5"
            width="11"
            height="9"
            rx="1.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
          />
          <path d="M2.5 6.2h11" stroke="currentColor" stroke-width="1.3" />
        </svg>
        <span>Fenster öffnen</span>
      </button>

      <button type="button" data-command="recheck">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M13 8a5 5 0 1 1-1.6-3.7M13 3v2.4h-2.4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span>Neu prüfen</span>
      </button>

      <hr />

      <button type="button" data-command="quit" class="is-danger">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M8 2.6v5.6M11.6 4.5a5 5 0 1 1-7.2 0"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linecap="round"
          />
        </svg>
        <span>FiveProtect beenden</span>
      </button>
    </nav>

    <script type="module" src="menu.js"></script>
  </body>
</html>
